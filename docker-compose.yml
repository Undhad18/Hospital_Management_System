# ==============================================================================
# ShopSphere Enterprise Production Deployment Topology
# Architecture: React SPA (CDN) -> Nginx (Reverse Proxy & Same-Origin) -> Express API -> MySQL & Redis
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Edge Reverse Proxy & Same-Origin Gateway (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: shopsphere-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./backend/uploads:/var/www/uploads:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. Frontend React Single Page Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: always
    expose:
      - "80"
    networks:
      - shopsphere-network

  # ----------------------------------------------------------------------------
  # 3. Backend Express API & Socket.IO Real-Time Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: always
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_USER=shopsphere_user
      - DB_PASSWORD=Secret_Production_Pass_2026!
      - DB_NAME=mern_stack_roadmap
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_production_key_shopsphere_2026
      - JWT_EXPIRES_IN=1d
      - STRIPE_SECRET_KEY=sk_test_mock_shopsphere_key
      - STRIPE_WEBHOOK_SECRET=whsec_mock_shopsphere_secret
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. Relational Database (MySQL 8.0 InnoDB)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=Root_Super_Secret_2026!
      - MYSQL_DATABASE=mern_stack_roadmap
      - MYSQL_USER=shopsphere_user
      - MYSQL_PASSWORD=Secret_Production_Pass_2026!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shopsphere-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot_Super_Secret_2026!"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. In-Memory Cache & Session / Idempotency Store (Redis 7.0)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  nginx_cache:
    driver: local

networks:
  shopsphere-network:
    driver: bridge
