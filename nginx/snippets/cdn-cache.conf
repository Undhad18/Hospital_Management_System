# ==============================================================================
# CDN & Edge Cache Header Policies
# ==============================================================================

# Long-lived Immutable Cache for Vite Bundled Hashed Assets (JS, CSS, Media)
# Safe to cache indefinitely because file hashes change on new deployments
location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache-Status "CDN-HIT-IMMUTABLE";
    access_log off;
    try_files $uri =404;
}

# HTML Single Page Application Entry Point
# Must NOT be cached long-term to ensure users get the latest index.html pointing to new bundle hashes
location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header X-Cache-Status "BYPASS-HTML";
    try_files $uri =404;
}
