# ==============================================================================
# Security Headers Snippet (OWASP Recommended)
# ==============================================================================

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking Protection (SameOrigin)
add_header X-Frame-Options "SAMEORIGIN" always;

# Cross-Site Scripting (XSS) Filter Protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy for Privacy Protection
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (Disables unused browser sensors)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

# Strict-Transport-Security (HSTS - 1 Year with Subdomains)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
