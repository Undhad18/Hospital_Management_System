# ==============================================================================
# ShopSphere Virtual Host: Same-Origin Reverse Proxy & CDN Edge Router
# Unified Single Origin serving React SPA (CDN) + Express REST API + WebSockets
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost shopsphere.io www.shopsphere.io;

    # Security Headers
    include /etc/nginx/snippets/security-headers.conf;

    # Root Directory for React SPA Static Distribution
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy (Express Backend Cluster)
    # --------------------------------------------------------------------------
    location /api/ {
        # Rate Limiting: 30 requests/sec with burst buffer of 20
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # Standard Proxy Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keepalive upstream optimization
        proxy_set_header Connection "";

        # Bypass CDN cache for dynamic API calls
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Architecture "Same-Origin-Reverse-Proxy" always;

        # Timeouts for ACID transactions and background queue operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. WebSocket Real-Time Stream (Socket.IO)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # WebSocket Protocol Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for long-lived real-time order tracking connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. Static Uploads (Multer Image Storage)
    # --------------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CDN Edge Cache for user-uploaded product images (7 Days)
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Cache-Status "CDN-MEDIA-CACHED";
    }

    # --------------------------------------------------------------------------
    # 4. Swagger OpenAPI Documentation
    # --------------------------------------------------------------------------
    location /api-docs/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------------------------------
    # 5. CDN Cache for Bundled Hashed Assets (/assets/*)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status "CDN-EDGE-IMMUTABLE";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 6. React Single Page Application (SPA Routing Fallback)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Served-By "ShopSphere-Edge-CDN" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
