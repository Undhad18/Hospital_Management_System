# ==============================================================================
# ShopSphere Production Nginx Configuration
# High-Performance Reverse Proxy, Same-Origin Router, and CDN Edge Simulator
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format with Latency & Upstream Response Times
    log_format production_json escape=json '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log production_json;
    error_log /var/log/nginx/error.log warn;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Security: Hide Nginx Version

    # Client Request Limits
    client_max_body_size 20M; # Accommodates Multer image uploads
    client_body_buffer_size 128k;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS & Brute Force Protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Proxy Cache Zone for CDN Micro-Caching
    proxy_cache_path /var/cache/nginx/cdn_cache levels=1:2 keys_zone=CDN_CACHE:50m max_size=1g inactive=60m use_temp_path=off;

    # Upstream Express Cluster
    upstream backend_cluster {
        server backend:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream Frontend Server (or served directly via static mount)
    upstream frontend_server {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Include Virtual Host Configurations
    include /etc/nginx/conf.d/*.conf;
}
